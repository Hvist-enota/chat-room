version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_room"]
      interval: 5s
      timeout: 3s
      retries: 20

name: Branch Name Check

on:
  pull_request:

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch name
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch: $BRANCH_NAME"

          PATTERN='^(dev|(feature|bugfix|hotfix|chore|refactor|test|docs)/[a-z0-9._-]+)$'

          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use format: type/short-description or dev"
            echo "Allowed: dev, feature, bugfix, hotfix, chore, refactor, test, docs"
            exit 1
          fi

          echo "Branch name is valid."

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChatRoom.slnx

      - name: Build
        run: dotnet build ChatRoom.slnx --configuration Release --no-restore

      - name: Test Unit
        run: dotnet test ChatRoom.UnitTests/ChatRoom.UnitTests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test Integration
        run: dotnet test ChatRoom.IntegrationTests/ChatRoom.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test Database
        run: dotnet test ChatRoom.DatabaseTests/ChatRoom.DatabaseTests.csproj --configuration Release --no-restore --verbosity normal

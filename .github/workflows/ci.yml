name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChatRoom.slnx

      - name: Build
        run: dotnet build ChatRoom.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ChatRoom.slnx --configuration Release --no-build --verbosity normal
